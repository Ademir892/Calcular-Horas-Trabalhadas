<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <title>Horas Trabalhadas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    .turno {
      margin-bottom: 10px;
    }

    .registro {
      border: 1px solid #ccc;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      background-color: #f9f9f9;
    }
  </style>
</head>

<body>
  <h1>Calculadora de Horas Trabalhadas</h1>

  <form id="form">
    <label>Nome do Funcionário:
      <input type="text" id="nome" required />
    </label><br><br>

    <label>Dia do Trabalho (1 a 31):
      <input type="number" id="dia" min="1" max="31" required />
    </label><br><br>

    <label>Mês do Trabalho (1 a 12):
      <input type="number" id="mes" min="1" max="12" required />
    </label><br><br>

    <div id="turnos-container"></div>

    <button type="button" onclick="adicionarTurno()">+ Adicionar Turno</button><br><br>
    <button type="submit">Registrar Horas</button>
  </form>

  <button onclick="limparLista()">🗑️ Limpar Lista</button>

  <h2>Registros:</h2>
  <div id="lista-registros"></div>

  <h2>Relatório:</h2>
  <div id="relatorio"></div>

  <script>
    const container = document.getElementById('turnos-container');
    const listaRegistros = document.getElementById('lista-registros');
    const relatorio = document.getElementById('relatorio');

    let nomeFuncionario = '';
    let diaAtual = 1;
    let mesAtual = new Date().getMonth() + 1; // Mês atual por padrão

    window.onload = () => {
      const nomeSalvo = localStorage.getItem('nomeFuncionario');
      if (nomeSalvo) {
        nomeFuncionario = nomeSalvo;
        document.getElementById('nome').value = nomeFuncionario;
      }

      const diaSalvo = localStorage.getItem('diaAtual');
      if (diaSalvo) {
        diaAtual = parseInt(diaSalvo, 10);
      }
      document.getElementById('dia').value = diaAtual;

      const mesSalvo = localStorage.getItem('mesAtual');
      if (mesSalvo) {
        mesAtual = parseInt(mesSalvo, 10);
      }
      document.getElementById('mes').value = mesAtual;
    };

    document.getElementById('nome').addEventListener('input', (e) => {
      nomeFuncionario = e.target.value;
      localStorage.setItem('nomeFuncionario', nomeFuncionario);
    });

    document.getElementById('mes').addEventListener('input', (e) => {
      mesAtual = parseInt(e.target.value, 10);
      localStorage.setItem('mesAtual', mesAtual);
    });

    document.getElementById('dia').addEventListener('input', (e) => {
      diaAtual = parseInt(e.target.value, 10);
      localStorage.setItem('diaAtual', diaAtual);
    });


    function adicionarTurno() {
      const div = document.createElement('div');
      div.className = 'turno';
      div.innerHTML = `
        <label>Entrada:
          <input type="time" class="entrada" required />
        </label>
        <label>Saída:
          <input type="time" class="saida" required />
        </label>
        <button type="button" onclick="removerTurno(this)">Remover</button>
      `;
      container.appendChild(div);
    }

    function removerTurno(botao) {
      botao.parentElement.remove();
    }

    function calcularHoras(entrada, saida) {
      if (!entrada || !saida) return 0;
      const [h1, m1] = entrada.split(':').map(Number);
      const [h2, m2] = saida.split(':').map(Number);
      let horas = h2 - h1;
      let minutos = m2 - m1;
      if (minutos < 0) {
        minutos += 60;
        horas -= 1;
      }
      return horas + minutos / 60;
    }

    function salvarRegistros(registros) {
      localStorage.setItem('registrosHoras', JSON.stringify(registros));
    }

    function carregarRegistros() {
      const registrosSalvos = JSON.parse(localStorage.getItem('registrosHoras')) || [];
      registrosSalvos.forEach(adicionarRegistroNaLista);
      atualizarRelatorio(registrosSalvos);
    }

    function adicionarRegistroNaLista(registroObj) {
      const div = document.createElement('div');
      div.className = 'registro';
      div.innerHTML = `<strong>${registroObj.nome}</strong> trabalhou <strong>${registroObj.horas.toFixed(2)}</strong> hora(s) no dia <strong>${registroObj.data}</strong>.`;
      listaRegistros.appendChild(div);
    }

    function atualizarRelatorio(registros) {
      const total = registros.reduce((soma, r) => soma + r.horas, 0);
      relatorio.innerHTML = `<p><strong>Total de horas no mês:</strong> ${total.toFixed(2)} hora(s)</p>`;
    }

    function limparLista() {
      if (confirm("Deseja realmente apagar todos os registros?")) {
        localStorage.removeItem('registrosHoras');
        listaRegistros.innerHTML = '';
        relatorio.innerHTML = '';
      }
    }

    document.getElementById('form').addEventListener('submit', function (e) {
      e.preventDefault();

      if (!nomeFuncionario) {
        alert("Por favor, insira o nome do funcionário.");
        return;
      }

      const dia = parseInt(document.getElementById('dia').value, 10);
      const mes = parseInt(document.getElementById('mes').value, 10);
      const entradas = document.querySelectorAll('.entrada');
      const saidas = document.querySelectorAll('.saida');

      let totalHoras = 0;
      for (let i = 0; i < entradas.length; i++) {
        totalHoras += calcularHoras(entradas[i].value, saidas[i].value);
      }

      const dataCompleta = new Date(2025, mes - 1, dia);
      const dataFormatada = dataCompleta.toLocaleDateString('pt-BR', {
        day: '2-digit', month: '2-digit', year: 'numeric'
      });

      const registroObj = {
        nome: nomeFuncionario,
        horas: totalHoras,
        data: dataFormatada
      };

      adicionarRegistroNaLista(registroObj);

      const registrosAtuais = JSON.parse(localStorage.getItem('registrosHoras')) || [];
      registrosAtuais.push(registroObj);
      salvarRegistros(registrosAtuais);

      atualizarRelatorio(registrosAtuais);

      diaAtual++;
      document.getElementById('dia').value = diaAtual;
      localStorage.setItem('diaAtual', diaAtual);

      document.getElementById('form').reset();
      container.innerHTML = '';
      adicionarTurno();

      location.reload();
    });

    adicionarTurno();
    carregarRegistros();
  </script>
</body>

</html>
